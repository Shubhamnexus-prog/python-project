name: Python Multi-Project CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Matrix का उपयोग करके यह आपके सभी प्रोजेक्ट्स को एक साथ रन करेगा
    strategy:
      matrix:
        project-dir: [
          'countdown timer',
          'password Generator',
          'qr code genretor',
          'song lyrics Extractor',
          'speak to word converter',
          'task-manager',
          'texteditor/texteditor'
        ]

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      # यह कमांड हर फ़ोल्डर के अंदर जाकर उसकी requirements.txt इंस्टॉल करेगी
      run: |
        cd "${{ matrix.project-dir }}"
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Run Tests
      # यह कमांड हर फ़ोल्डर में जाकर टेस्ट रन करेगी (अगर pytest इंस्टॉल है)
      run: |
        cd "${{ matrix.project-dir }}"
        if pip show pytest > /dev/null; then
          pytest
        else
          echo "No pytest found in ${{ matrix.project-dir }}, skipping tests."
        fi  
