name: Python Multi-Project CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project-dir: [
          'countdown timer',
          'password  Generator',
          'qr code genretor',
          'song lyrics Extractor',
          'speak to  word converter',
          'task-manager',
          'texteditor/texteditor'
        ]

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd "${{ matrix.project-dir }}"
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Run Tests
      run: |
        cd "${{ matrix.project-dir }}"
        if pip show pytest > /dev/null; then
          pytest
        else
          echo "No pytest found in ${{ matrix.project-dir }}, skipping tests."
        fi
